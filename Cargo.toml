[package]
name = "dm-database-parser-sqllog"
version = "1.1.0"
edition = "2024"
authors = ["guangl"]
description = "一个高性能的达梦数据库 sqllog 日志解析库，支持 LogParserBuilder 链式配置、过滤方法和直接字段访问"
license = "MIT"
repository = "https://github.com/guangl/dm-database-parser-sqllog"
documentation = "https://docs.rs/dm-database-parser-sqllog"
homepage = "https://github.com/guangl/dm-database-parser-sqllog"
keywords = ["sqllog", "parser", "dm-database", "dameng"]
categories = ["parsing", "database", "text-processing"]
exclude = [
    "benches",
    "docs",
    "examples",
    "sqllogs",
    "target",
    "tests",
    ".github",
    "*.json",
    ".gitignore",
    ".agents",
    ".gsd",
    ".bg-shell",
    ".mcp.json",
    "skills-lock.json",
]

[lib]
name = "dm_database_parser_sqllog"
path = "src/lib.rs"
crate-type = ["lib"]

[profile.release]
lto = "fat"
codegen-units = 1

[dependencies]
atoi = "2.0.0"
memchr = "2.7.6"
thiserror = "2.0.17"
encoding = "0.2"
tokio = { version = "1", features = ["rt"], optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports", "plotters"] }
tempfile = "3.8"
tokio = { version = "1", features = ["rt", "macros"] }

[features]
async = ["tokio/rt"]

[[bench]]
name = "parser_benchmark"
harness = false
